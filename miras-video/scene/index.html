<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../lib/base.css">
<style>
 :root{--navy:#101B33;--ivory:#F5F0E6;--copper:#C47F5A;--cop1:#e7b48f;--cop3:#8c5434;--f-head:'Noto Serif Display',serif;--f-sub:'Lato',sans-serif}
 html,body{background:#0a1020}
 .shot{position:absolute;inset:0;overflow:hidden;opacity:0}

 /* ---------- code-built studio set: linen surface + book box (top-down) ---------- */
 #set{opacity:1;background:#0a1020}
 #world{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0}
 #linen{position:absolute;left:-310px;top:-210px;width:1700px;height:2600px;background:url(assets/linen.jpg) 0 0/1700px 1300px repeat}
 .box{position:absolute;left:130px;top:890px;width:820px;height:620px;transform-style:preserve-3d;perspective:2600px}
 .shadowB{position:absolute;inset:-6px;border-radius:14px;box-shadow:40px 60px 90px rgba(20,16,10,.55),12px 18px 26px rgba(20,16,10,.35)}
 .tray{position:absolute;inset:0;border-radius:12px;background:linear-gradient(180deg,#f2ebdf,#e2d8c8);box-shadow:inset 0 0 0 5px #0d1629,inset 0 0 0 8px var(--copper)}
 .comp{position:absolute;border-radius:6px;background-color:#1b130d;background-image:url(assets/interior.jpg);background-repeat:no-repeat;box-shadow:inset 0 0 0 6px #101B33,inset 0 14px 24px rgba(0,0,0,.6)}
 #cNuts{left:30px;top:30px;width:440px;height:560px;background-size:1986px 854px;background-position:-534px -232px}
 #cApr{left:486px;top:30px;width:304px;height:270px;background-size:1737px 747px;background-position:-954px -61px}
 #cDat{left:486px;top:316px;width:304px;height:274px;background-size:1626px 699px;background-position:-1064px -333px}
 .lid{position:absolute;inset:-4px;transform-origin:50% 0;transform-style:preserve-3d}
 .lid .face,.lid .back{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;overflow:hidden}
 .lid .face{background:#101B33;box-shadow:inset 0 0 0 6px var(--copper),inset 0 0 0 7px #e9b48e,inset 0 0 0 9px #0c1428}
 .lid .back{transform:rotateX(180deg);background:#13203d;box-shadow:inset 0 0 0 6px var(--copper),inset 0 0 0 26px #13203d,inset 0 0 0 28px rgba(196,127,90,.45)}
 .tex{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:soft-light;opacity:.75}
 .foil{position:absolute;left:50%;top:50%;width:300px;transform:translate(-50%,-50%)}
 .sheen{position:absolute;left:50%;top:50%;width:300px;height:314px;transform:translate(-50%,-50%);-webkit-mask:url(assets/logo_foil.png) center/100% 100% no-repeat;mask:url(assets/logo_foil.png) center/100% 100% no-repeat;background:linear-gradient(105deg,transparent 30%,rgba(255,226,196,.85) 46%,transparent 62%) 0 0/300% 100% no-repeat;mix-blend-mode:screen}
 .tab{position:absolute;left:375px;top:612px;width:70px;height:26px;border-radius:0 0 6px 6px;background:linear-gradient(180deg,#d69a73,#a7663f)}
 .seam{position:absolute;left:30px;right:30px;top:612px;height:60px;background:radial-gradient(60% 100% at 50% 0%,rgba(255,226,180,.85),rgba(255,226,180,0) 75%);opacity:0;filter:blur(4px);transform:translateZ(1px)}
 .card{position:absolute;background:linear-gradient(160deg,#f8f4ec,#ede5d6);border-radius:6px;box-shadow:0 18px 30px rgba(0,0,0,.35),0 2px 4px rgba(0,0,0,.25);display:flex;flex-direction:column;align-items:center;justify-content:center}
 .card .deer{width:24%;opacity:.95}
 .card .rule{width:44%;height:2px;margin-top:6%;background:linear-gradient(90deg,transparent,var(--copper),transparent)}
 .card .rule2{width:30%;height:2px;margin-top:4%;background:linear-gradient(90deg,transparent,rgba(196,127,90,.6),transparent)}
 #card1{left:180px;top:150px;width:460px;height:310px}
 #card2{left:40px;top:150px;width:420px;height:280px}
 #light{position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light}
 #dof{position:absolute;inset:0;pointer-events:none;backdrop-filter:blur(7px);-webkit-mask:radial-gradient(60% 42% at 50% 47%,transparent 55%,#000 100%);mask:radial-gradient(60% 42% at 50% 47%,transparent 55%,#000 100%)}

 /* ---------- photo shots: blurred fill + feathered sharp plate ---------- */
 .fill{position:absolute;inset:-8%;width:116%;height:116%;object-fit:cover;filter:blur(70px) brightness(.36) saturate(.85)}
 .plate{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%)}
 .plate img{display:block;width:100%;height:100%;object-fit:cover;-webkit-mask:linear-gradient(180deg,transparent 0,#000 14%,#000 86%,transparent 100%),linear-gradient(90deg,transparent 0,#000 8%,#000 92%,transparent 100%);-webkit-mask-composite:source-in;mask:linear-gradient(180deg,transparent 0,#000 14%,#000 86%,transparent 100%) intersect,linear-gradient(90deg,transparent 0,#000 8%,#000 92%,transparent 100%)}
 .pan .plate img{-webkit-mask:linear-gradient(180deg,transparent 0,#000 14%,#000 86%,transparent 100%);mask:linear-gradient(180deg,transparent 0,#000 14%,#000 86%,transparent 100%)}
 .slight{position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light}

 /* ---------- end ---------- */
 #end{background:radial-gradient(120% 80% at 50% 40%,#18284a,#101B33 55%,#0a1124)}
 #logo{position:absolute;left:50%;top:560px;width:470px;margin-left:-235px}
 #logoSheen{position:absolute;left:50%;top:560px;width:470px;height:492px;margin-left:-235px;-webkit-mask:url(assets/logo_reverse.png) center/100% 100% no-repeat;mask:url(assets/logo_reverse.png) center/100% 100% no-repeat;background:linear-gradient(105deg,transparent 35%,rgba(255,240,222,.55) 50%,transparent 65%) 0 0/300% 100% no-repeat;mix-blend-mode:screen}
 .slogan{position:absolute;left:0;right:0;text-align:center;font:400 italic 78px/1.1 var(--f-head);color:var(--ivory);letter-spacing:.005em}
 #sl1{top:1170px} #sl2{top:1262px}
 #mainT{position:absolute;left:90px;right:90px;top:300px;text-align:center;font:400 italic 76px/1.12 var(--f-head);color:var(--ivory);text-shadow:0 6px 40px rgba(0,0,0,.55);opacity:0}

 /* ---------- subtitles ---------- */
 #sub{position:absolute;left:80px;right:80px;top:1440px;text-align:center;z-index:60}
 #sub span{display:inline-block;font:600 42px/1.32 var(--f-sub);color:var(--ivory);padding:10px 22px;border-radius:14px;background:rgba(10,16,32,.42);text-shadow:0 2px 10px rgba(0,0,0,.6);letter-spacing:.005em}
 .vignette{z-index:40;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.5) 100%)} .grain{z-index:50;opacity:.35}

 /* ---------- animatic overlay ---------- */
 #anim{display:none;position:absolute;left:0;right:0;top:0;z-index:80;font:600 30px/1.35 var(--f-sub);color:#fff}
 body.animatic #anim{display:block}
 #anim .bar{background:rgba(0,0,0,.72);padding:22px 30px}
 #anim .s{color:#f2c19f;font-weight:700;letter-spacing:.06em}
 #anim .c{opacity:.85;font-weight:400;font-size:26px}
 #anim .k{display:inline-block;margin-left:10px;padding:2px 12px;border-radius:999px;background:#c47f5a;color:#101B33;font-size:22px;font-weight:700}
 #tc{position:absolute;right:24px;top:1860px;z-index:80;font:700 28px var(--f-sub);color:#fff;background:rgba(0,0,0,.6);padding:4px 12px;border-radius:8px;display:none}
 body.animatic #tc{display:block}
</style>
<script src="../../lib/gsap.min.js"></script><script src="../../lib/motion.js"></script></head><body>
<div class="stage">

  <!-- S1/S2/S7/S10: studio set -->
  <div class="shot" id="set">
    <div id="world">
      <div id="linen"></div>
      <div class="box" id="b1">
        <div class="shadowB" id="bShadow"></div>
        <div class="tray"><div class="comp" id="cNuts"></div><div class="comp" id="cApr"></div><div class="comp" id="cDat"></div>
          <div class="card" id="card2"><img class="deer" src="assets/deer.png"><div class="rule"></div><div class="rule2"></div></div></div>
        <div class="lid" id="lid">
          <div class="back"><svg class="tex"><filter id="tb"><feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" seed="9"/><feDiffuseLighting surfaceScale="1.2" lighting-color="#fff"><feDistantLight azimuth="210" elevation="40"/></feDiffuseLighting></filter><rect width="100%" height="100%" filter="url(#tb)"/></svg>
            <div class="card" id="card1"><img class="deer" src="assets/deer.png"><div class="rule"></div><div class="rule2"></div></div></div>
          <div class="face"><svg class="tex"><filter id="tf"><feTurbulence type="fractalNoise" baseFrequency="0.95" numOctaves="3" seed="2"/><feDiffuseLighting surfaceScale="1.4" lighting-color="#fff"><feDistantLight id="lidLight" azimuth="210" elevation="36"/></feDiffuseLighting></filter><rect width="100%" height="100%" filter="url(#tf)"/></svg>
            <img class="foil" src="assets/logo_foil.png"><div class="sheen" id="sheen"></div></div>
          <div class="tab"></div>
        </div>
        <div class="seam" id="seam"></div>
      </div>
    </div>
    <div id="light"></div>
  </div>

  <!-- photo shots (brandbook concept visuals) -->
  <div class="shot pan" id="s3"><img class="fill" src="assets/interior.jpg"><div class="plate" style="width:1440px;height:620px"><img id="i3" src="assets/interior.jpg"></div><div class="slight"></div></div>
  <div class="shot" id="s4"><img class="fill" src="assets/emboss.jpg"><div class="plate" style="width:1080px;height:680px"><img id="i4" src="assets/emboss.jpg"></div><div class="slight"></div></div>
  <div class="shot pan" id="s5"><img class="fill" src="assets/cardnavy.jpg"><div class="plate" style="width:1300px;height:488px"><img id="i5" src="assets/cardnavy.jpg"></div><div class="slight"></div></div>
  <div class="shot" id="s6"><img class="fill" src="assets/napkin11.jpg"><div class="plate" style="width:1240px;height:768px"><img id="i6" src="assets/napkin11.jpg"></div><div class="slight"></div></div>
  <div class="shot pan" id="s8"><img class="fill" src="assets/ribbon12.jpg"><div class="plate" style="width:2160px;height:560px"><img id="i8" src="assets/ribbon12.jpg"></div><div class="slight"></div></div>
  <div class="shot" id="s9"><img class="fill" src="assets/bag09.jpg"><div class="plate" style="width:1300px;height:791px"><img id="i9" src="assets/bag09.jpg"></div><div class="slight"></div></div>
  <div class="shot" id="s11"><img class="fill" src="assets/poster_box.jpg"><div class="plate" style="width:1180px;height:813px;top:48%"><img id="i11" src="assets/poster_box.jpg"></div><div class="slight" id="sl11"></div></div>

  <div id="mainT">bu, mənim üçün seçilib.</div>

  <div class="shot" id="end">
    <img id="logo" src="assets/logo_reverse.png"><div id="logoSheen"></div>
    <div class="slogan" id="sl1">Anlar ötər.</div>
    <div class="slogan" id="sl2">MIRAS qalar.</div>
  </div>

  <div id="sub"><span id="subT"></span></div>
  <div class="vignette"></div>
  <canvas class="grain" id="grain"></canvas>
  <div id="anim"><div class="bar"><div><span class="s" id="aS"></span><span class="k" id="aK"></span></div><div id="aV"></div><div class="c" id="aC"></div></div></div>
  <div id="tc"></div>
</div>
<script>
const END = 45.0;
const ANIM = new URLSearchParams(location.search).has('animatic');
if (ANIM) document.body.classList.add('animatic');

// subtitles: script text, times from the VO word stamps (cues.json)
const SUBS = [
  [2.70, 4.72, 'Bəzən bir hədiyyə demək istədiyiniz'], [4.74, 6.30, 'hər şeyi çatdırır.'],
  [6.62, 7.98, 'Bir təşəkkürü.'], [8.13, 9.62, 'Bir təbriki.'], [9.70, 12.20, 'Ya da sadəcə onu düşündüyünüzü.'],
  [12.50, 14.28, 'MIRAS-da hədiyyəni onu alacaq'], [14.30, 16.45, 'insanı düşünərək seçirik.'],
  [16.78, 19.22, 'Qutunun toxumasından içindəki karta qədər'], [19.24, 20.62, 'hər detal həmin insana'], [20.64, 22.70, 'və həmin ana uyğun gəlir.'],
  [23.34, 24.70, 'Yaxınınızın özəl günü,'], [24.72, 25.86, 'komandanızın uğuru'], [25.88, 28.45, 'və ya dəyər verdiyiniz tərəfdaş üçün.'],
  [28.88, 31.02, 'Qutu açılanda içindəkilərdən əvvəl'], [31.04, 32.75, 'bir fikir hiss olunur:'],
];
// shot list (also drives the animatic overlay)
const SHOTS = [
  ['01', 0.0, 5.0, 'Tünd göy qutunun kənarı, makro', 'Yavaş geri dolly; yan işıq soldan sağa sürüşür; 2.4 s-də qapaq aralanır', 'KOD', 'Qapaq: yüngül cırıltı'],
  ['02', 5.0, 12.0, 'Qapaq açılır → fil sümüyü kart → içlik', 'Geri çəkilmə, sonra kartdan içliyə doğru tilt', 'KOD + konsept foto', 'Kağız xışıltısı 6.0 s'],
  ['03', 12.0, 16.75, 'Kompozisiya 1: fındıq, qaysı, xurma', 'Soldan sağa yavaş panorama', 'KONSEPT (brendbuk 08)', ''],
  ['04', 16.75, 18.05, 'Dəri faktura, basma maral', 'Yavaş itələmə (push-in)', 'KONSEPT (brendbuk 14)', ''],
  ['05', 18.05, 19.9, 'Kompozisiya 2: korporativ kart', 'Yan sürüşmə', 'KONSEPT (brendbuk 10)', ''],
  ['06', 19.9, 23.1, 'Kompozisiya 3: fil sümüyü tekstil, servis', 'Yavaş itələmə', 'KONSEPT (brendbuk 11)', ''],
  ['07', 23.1, 26.3, 'Kart qutuya yerləşdirilir', 'Statik üst plan, yüngül drift', 'KOD + konsept foto', 'Kağız + yumşaq toxunuş'],
  ['08', 26.3, 28.75, 'Lent və mum möhür', 'Soldan sağa panorama möhürə qədər', 'KONSEPT (brendbuk 12)', ''],
  ['09', 28.75, 32.7, 'Təqdimat: hədiyyə paketi', 'Sakit itələmə', 'KONSEPT (brendbuk 09)', ''],
  ['10', 32.7, 35.0, 'Şəxsi kartın yaxın planı', 'Karta yavaş zoom', 'KOD', ''],
  ['11', 35.0, 37.6, 'Bağlı qutu, yumşaq işıq', 'Yavaş itələmə; işıq qapaq üzərindən keçir', 'KONSEPT (poster)', 'Hava, qapaq səsi'],
  ['12', 37.6, 45.0, 'Tam MIRAS loqosu + sloqan', 'Statik; loqo yumşaq gəlir', 'ORİJİNAL LOQO (ters versiya)', 'Final akkord'],
];

let seed = 3;
document.fonts.ready.then(() => {
  const tl = gsap.timeline({ paused: true });
  const W = document.getElementById('world');
  const cam = (px, py, s, cy = 900) => ({ x: 540 - px * s, y: cy - py * s, scale: s });
  const show = (id, t, d = .35) => tl.fromTo(id, { autoAlpha: 0 }, { autoAlpha: 1, duration: d, ease: 'power1.inOut', immediateRender: false }, t);
  const hide = (id, t, d = .35) => tl.to(id, { autoAlpha: 0, duration: d, ease: 'power1.inOut' }, t);
  gsap.set('#set', { autoAlpha: 1 });

  // ---------- S1 0–5: macro on the box edge, lid cracks at 2.4 ----------
  gsap.set(W, cam(560, 1490, 2.7));
  tl.fromTo(W, cam(560, 1490, 2.7), Object.assign(cam(470, 1380, 1.9), { duration: 4.9, ease: 'sine.inOut' }), 0);
  tl.fromTo('#lid', { rotationX: 0 }, { rotationX: 7, duration: .6, ease: 'power2.out' }, 2.35);
  tl.fromTo('#seam', { opacity: 0 }, { opacity: 1, duration: .6 }, 2.4);
  tl.fromTo('#sheen', { backgroundPosition: '100% 0' }, { backgroundPosition: '0% 0', duration: 4.2, ease: 'sine.inOut' }, .3);

  // ---------- S2 5–12: lid opens, card, contents ----------
  tl.to('#lid', { rotationX: 180, duration: 1.6, ease: 'power2.inOut' }, 4.95);
  tl.to('#seam', { opacity: 0, duration: .6 }, 5.4);
  tl.to(W, Object.assign(cam(540, 890, .84, 930), { duration: 1.7, ease: 'power2.inOut' }), 4.9);
  tl.to(W, Object.assign(cam(540, 600, 1.32, 880), { duration: 2.6, ease: 'sine.inOut' }), 6.6);       // to the ivory card
  tl.to(W, Object.assign(cam(560, 1190, 1.2, 900), { duration: 2.6, ease: 'sine.inOut' }), 9.3);      // tilt down to the contents
  gsap.set('#card2', { autoAlpha: 0 });

  // ---------- photo shots 12–23 ----------
  hide('#set', 11.85, .3);
  show('#s3', 11.8, .3); tl.fromTo('#i3', { x: 180 }, { x: -180, duration: 5.3, ease: 'sine.inOut' }, 11.8);
  show('#s4', 16.6, .3); hide('#s3', 16.75, .2); tl.fromTo('#i4', { scale: 1.0 }, { scale: 1.14, duration: 1.8, ease: 'sine.out' }, 16.6);
  show('#s5', 17.9, .3); hide('#s4', 18.05, .2); tl.fromTo('#i5', { x: 60, scale: 1.04 }, { x: -60, scale: 1.0, duration: 2.3, ease: 'sine.inOut' }, 17.9);
  show('#s6', 19.75, .35); hide('#s5', 19.95, .2); tl.fromTo('#i6', { scale: 1.12, x: 20 }, { scale: 1.0, x: -20, duration: 3.6, ease: 'none' }, 19.75);

  // ---------- S7 23.1–26.3: the card is placed into the box ----------
  tl.set(W, cam(560, 1190, 1.12, 920), 22.9);
  show('#set', 22.95, .35); hide('#s6', 23.2, .25);
  tl.to(W, Object.assign(cam(520, 1170, 1.2, 920), { duration: 3.4, ease: 'sine.inOut' }), 23.0);
  tl.fromTo('#card2', { autoAlpha: 1, x: 700, y: -520, rotation: 28, scale: 1.25 }, { x: 0, y: 0, rotation: -7, scale: 1, duration: 1.15, ease: 'power3.out', immediateRender: false }, 23.45);
  tl.to('#card2', { rotation: -6, y: 4, duration: .25, ease: 'power2.out' }, 24.55);

  // ---------- 26.3–32.7: ribbon & seal, presentation ----------
  show('#s8', 26.15, .35); hide('#set', 26.35, .25);
  tl.fromTo('#i8', { x: 520 }, { x: -520, duration: 2.75, ease: 'sine.inOut' }, 26.15);
  show('#s9', 28.6, .4); hide('#s8', 28.85, .25); tl.fromTo('#i9', { scale: 1.0, x: -15 }, { scale: 1.12, x: 15, duration: 4.4, ease: 'none' }, 28.6);

  // ---------- S10 32.7–35: close on the personal card ----------
  tl.set(W, cam(380, 1180, 1.35, 1000), 32.4);
  show('#set', 32.55, .35); hide('#s9', 32.8, .3);
  tl.to(W, Object.assign(cam(380, 1175, 1.75, 1010), { duration: 2.6, ease: 'sine.inOut' }), 32.55);
  tl.fromTo('#mainT', { autoAlpha: 0, y: 24, filter: 'blur(8px)' }, { autoAlpha: 1, y: 0, filter: 'blur(0px)', duration: .9, ease: 'power2.out' }, 33.05);

  // ---------- S11 35–37.6: closed box ----------
  show('#s11', 34.85, .5); hide('#set', 35.2, .3); hide('#mainT', 34.85, .4);
  tl.fromTo('#i11', { scale: 1.0 }, { scale: 1.07, duration: 3.0, ease: 'sine.inOut' }, 34.85);
  tl.fromTo('#sl11', { background: 'linear-gradient(100deg,rgba(255,236,214,0) 0%,rgba(255,236,214,0) 40%,rgba(255,236,214,0) 100%)' },
    { background: 'linear-gradient(100deg,rgba(255,236,214,0) 0%,rgba(255,236,214,.38) 55%,rgba(255,236,214,0) 100%)', duration: 2.4, ease: 'sine.inOut' }, 35.0);

  // ---------- S12 37.6–45: original logo + slogan ----------
  show('#end', 37.45, .7);
  tl.fromTo('#logo', { scale: 1.035, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 1.4, ease: 'power2.out' }, 37.6);
  tl.fromTo('#logoSheen', { backgroundPosition: '100% 0' }, { backgroundPosition: '0% 0', duration: 2.6, ease: 'sine.inOut' }, 38.4);
  tl.fromTo('#sl1', { autoAlpha: 0, y: 18 }, { autoAlpha: 1, y: 0, duration: .9, ease: 'power2.out' }, 38.78);
  tl.fromTo('#sl2', { autoAlpha: 0, y: 18 }, { autoAlpha: 1, y: 0, duration: .9, ease: 'power2.out' }, 40.74);
  tl.fromTo(['#logo', '#logoSheen'], { y: 0, scale: 1 }, { y: -10, scale: 1.045, duration: END - 39.0, ease: 'sine.inOut' }, 39.0);
  tl.fromTo(['#sl1', '#sl2'], { scale: 1 }, { scale: 1.025, duration: END - 41.6, ease: 'sine.inOut' }, 41.6);
  tl.fromTo('#logoSheen', { backgroundPosition: '100% 0' }, { backgroundPosition: '0% 0', duration: 2.8, ease: 'sine.inOut', immediateRender: false }, 42.0);
  tl.to({}, { duration: .01 }, END - .01);

  // ---------- light that moves (studio side light) ----------
  const L = document.getElementById('light'), lidLight = document.getElementById('lidLight');
  const slights = [...document.querySelectorAll('.slight')].filter(s => s.id !== 'sl11');
  const endEl = document.getElementById('end');
  const subT = document.getElementById('subT'), sub = document.getElementById('sub');
  const aS = document.getElementById('aS'), aK = document.getElementById('aK'), aV = document.getElementById('aV'), aC = document.getElementById('aC'), tc = document.getElementById('tc');
  const grain = M.grain('#grain', { alpha: 10 });
  window.onSeek = t => {
    const lx = 15 + 40 * Math.sin(t * .12);                            // light pool drifts
    L.style.background = `radial-gradient(70% 55% at ${lx}% 35%,rgba(255,240,220,.55),rgba(255,240,220,0) 70%),linear-gradient(90deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.35))`;
    endEl.style.background = `radial-gradient(120% 80% at ${50 + 14 * Math.sin(t * .35)}% ${38 + 4 * Math.cos(t * .3)}%,#1b2d52,#101B33 55%,#0a1124)`;
    slights.forEach(s => s.style.background = `radial-gradient(80% 60% at ${20 + 25 * Math.sin(t * .2)}% 30%,rgba(255,236,214,.35),rgba(255,236,214,0) 70%)`);
    lidLight.setAttribute('azimuth', 200 + t * 6);
    const c = SUBS.find(s => t >= s[0] && t < s[1]);
